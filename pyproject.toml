[project]
name = "jev-senselab-demos"
version = "0.1.0"
description = "Four business decisions made by Jev (TypeSafe AI) and improved over time by SenseLab's recursive self-improvement loop."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "amfs>=0.5.36",
    "amfs-adapter-http>=0.1.35",
    "typesafe-sdk>=0.7.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The retrieval baseline embeds past cases locally. Not needed for the headline run.
baseline = ["fastembed>=0.3"]
dev = ["ruff>=0.5", "pytest>=8"]

[tool.uv]
# This repo is run in place (`python -m core.runner ...`), not installed as a package.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
